<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>VisaRadar</title>
<style>
  :root{
    --mx: 50%;
    --my: 50%;
    --accent: #FF9500;
    --strong: #30D158;
    --moderate: #FFD60A;
    --weak: #FF9F0A;
    --none: #8E8E93;
    --strong-tint: rgba(48,209,88,0.14);
    --moderate-tint: rgba(255,214,10,0.16);
    --weak-tint: rgba(255,159,10,0.14);
    --none-tint: rgba(142,142,147,0.16);
  }

  *{ box-sizing: border-box; }

  html, body{ margin: 0; padding: 0; }

  body{
    min-height: 100vh;
    background: #FBFBFD;
    background-image:
      radial-gradient(1100px 720px at 50% -12%, rgba(255,149,0,0.08), transparent 60%);
    background-attachment: fixed;
    color: #0A0A0C;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    justify-content: center;
  }

  .stage{
    width: 100%;
    max-width: 640px;
    padding: 60px 22px 128px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 40px;
  }

  /* ---------- Header ---------- */
  .header{
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .eyebrow{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(10,10,12,0.4);
  }
  h1{
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.035em;
    margin: 0;
    line-height: 1.04;
  }
  .tagline{
    font-size: 16px;
    font-weight: 400;
    color: rgba(10,10,12,0.6);
    line-height: 1.5;
    max-width: 44ch;
    margin: 0;
  }

  /* ---------- Glass card base ---------- */
  .glass{
    position: relative;
    overflow: hidden;
    background: rgba(255,255,255,0.55);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.10), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  .glass::before{
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle 220px at var(--mx, 50%) var(--my, 50%),
      rgba(255,255,255,0.25), transparent 70%);
  }
  .glass > *{ position: relative; z-index: 1; }

  .input-card{ padding: 22px; }

  /* ---------- Textarea ---------- */
  #input{
    display: block;
    width: 100%;
    min-height: 140px;
    resize: vertical;
    font-family: "SF Mono", ui-monospace, "SF Mono Regular", Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.55;
    color: inherit;
    background: transparent;
    border: 0;
    border-radius: 12px;
    padding: 14px 16px;
    outline: none;
  }
  #input::placeholder{ color: rgba(10,10,12,0.35); }
  #input:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Button ---------- */
  .actions{
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
  }
  button.go{
    appearance: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.16);
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  button.go:hover{
    transform: scale(1.03);
    box-shadow: 0 6px 20px rgba(0,0,0,0.22);
  }
  button.go:active{ transform: scale(0.98); }
  button.go:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Error banner ---------- */
  .error{
    font-size: 13px;
    color: #E33B3B;
    background: rgba(255,59,48,0.08);
    border: 1px solid rgba(255,59,48,0.28);
    border-radius: 14px;
    padding: 12px 16px;
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    display: none;
  }
  .error.show{ display: block; }

  /* ---------- Result card ---------- */
  .result{
    padding: 24px;
    display: none;
    flex-direction: column;
    gap: 18px;
  }
  .result.reveal{ display: flex; animation: cardIn 0.35s ease forwards; }

  .result-top{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .company{
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .title{
    font-size: 16px;
    color: rgba(10,10,12,0.6);
    margin: 4px 0 0;
  }
  .confidence{
    flex: none;
    text-align: right;
    line-height: 1;
  }
  .confidence b{
    display: block;
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .confidence span{
    display: block;
    font-size: 12px;
    color: rgba(10,10,12,0.5);
    margin-top: 3px;
    letter-spacing: 0.01em;
  }

  .meta{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    color: rgba(10,10,12,0.6);
  }
  .loc{ font-size: 15px; }

  .badge{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 11px;
    border-radius: 999px;
    letter-spacing: 0.01em;
    text-transform: capitalize;
    white-space: nowrap;
  }
  .badge .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }
  .badge.strong   { color: var(--strong);   background: var(--strong-tint); }
  .badge.moderate { color: var(--moderate); background: var(--moderate-tint); }
  .badge.weak     { color: var(--weak);     background: var(--weak-tint); }
  .badge.none     { color: var(--none);     background: var(--none-tint); }
  .badge.strong .dot   { background: var(--strong); }
  .badge.moderate .dot { background: var(--moderate); }
  .badge.weak .dot     { background: var(--weak); }
  .badge.none .dot     { background: var(--none); }

  .evidence{
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .row{
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.45;
    color: rgba(10,10,12,0.78);
  }
  .result.reveal .row{
    animation: rowIn 0.4s ease forwards;
    animation-delay: calc(var(--i, 0) * 60ms);
    opacity: 0;
    transform: translateY(8px);
  }

  .keyhint{
    font-size: 11.5px;
    color: rgba(10,10,12,0.4);
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* ---------- Keyframes ---------- */
  @keyframes cardIn{
    from{ opacity: 0; transform: scale(0.96); }
    to  { opacity: 1; transform: scale(1); }
  }
  @keyframes rowIn{
    from{ opacity: 0; transform: translateY(8px); }
    to  { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    .result.reveal{ animation: none !important; opacity: 1; transform: none; }
    .result .row{ animation: none !important; opacity: 1 !important; transform: none !important; }
    button.go{ transition: none !important; }
    button.go:hover{ transform: none; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 480px){
    .stage{ padding: 44px 16px 96px; gap: 32px; }
    h1{ font-size: 28px; }
    .input-card{ padding: 16px; }
    .result{ padding: 18px; }
    .actions{
      justify-content: stretch;
      flex-direction: column;
    }
    button.go{ width: 100%; }
  }

  /* ---------- Dark mode ---------- */
  @media (prefers-color-scheme: dark){
    body{
      color: #F5F5F7;
      background: #000000;
      background-image:
        radial-gradient(1100px 720px at 50% -12%, rgba(255,149,0,0.14), transparent 62%);
    }
    .eyebrow{ color: rgba(245,245,247,0.4); }
    .tagline{ color: rgba(245,245,247,0.6); }

    .glass{
      background: rgba(28,28,30,0.55);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 12px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .glass::before{
      background: radial-gradient(circle 220px at var(--mx, 50%) var(--my, 50%),
        rgba(255,255,255,0.12), transparent 70%);
    }

    #input::placeholder{ color: rgba(245,245,247,0.3); }
    .error{
      color: #FF6961;
      background: rgba(255,59,48,0.14);
      border-color: rgba(255,59,48,0.35);
    }
    .title, .loc{ color: rgba(245,245,247,0.6); }
    .confidence span{ color: rgba(245,245,247,0.5); }
    .row{
      background: rgba(255,255,255,0.06);
      color: rgba(245,245,247,0.78);
    }
    .keyhint{ color: rgba(245,245,247,0.35); }
  }
</style>
</head>
<body>
  <main class="stage">
    <header class="header">
      <p class="eyebrow">DOL Filing Intelligence</p>
      <h1>VisaRadar</h1>
      <p class="tagline">See if a company actually sponsors visas — powered by local LLMs and real DOL filing data.</p>
    </header>

    <section class="glass input-card">
      <label for="input" class="keyhint" style="display:block;text-align:left;margin-bottom:10px;">Paste a filing record</label>
      <textarea id="input" spellcheck="false" aria-label="Visa filing JSON">{"company": "Google LLC", "title": "Senior Software Engineer", "location": "Mountain View, CA", "label": "strong", "evidence": ["total filings: 9673", "certified percentage: 99%", "increasing filing volume year over year"], "match_confidence": 1.0}</textarea>
      <div class="actions">
        <button id="go" class="go" type="button">Visualize →</button>
      </div>
    </section>

    <div id="error" class="error" role="alert">That&rsquo;s not valid JSON — check the format and try again.</div>

    <section id="result" class="glass result" aria-live="polite">
      <div class="result-top">
        <div>
          <h2 id="company" class="company"></h2>
          <p id="title" class="title"></p>
        </div>
        <div class="confidence">
          <b id="conf-pct"></b>
          <span>match confidence</span>
        </div>
      </div>

      <div class="meta">
        <span id="label" class="badge"></span>
        <span id="loc" class="loc"></span>
      </div>

      <ul id="evidence" class="evidence"></ul>
    </section>

    <p class="keyhint">Move your cursor to feel the glass. Local LLMs · real DOL data · nothing leaves your device.</p>
  </main>

  <script>
    (function(){
      var root = document.documentElement;
      var input = document.getElementById('input');
      var btn = document.getElementById('go');
      var result = document.getElementById('result');
      var errEl = document.getElementById('error');
      var companyEl = document.getElementById('company');
      var titleEl = document.getElementById('title');
      var confEl = document.getElementById('conf-pct');
      var labelEl = document.getElementById('label');
      var locEl = document.getElementById('loc');
      var evidenceEl = document.getElementById('evidence');

      /* Signature interaction: reactive specular highlight tracks the cursor.
         --mx / --my are initialized to 50% / 50% via CSS; set to px on move. */
      document.addEventListener('mousemove', function(e){
        root.style.setProperty('--mx', e.clientX + 'px');
        root.style.setProperty('--my', e.clientY + 'px');
      }, { passive: true });

      function esc(s){
        var d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
      }

      function fmtConfidence(c){
        var num = parseFloat(c);
        if (isNaN(num)) return '0';
        return Math.round(num * 100);
      }

      function render(data){
        var label = (String(data.label || 'none').toLowerCase()).replace(/[^a-z]/g, '');
        if (label !== 'strong' && label !== 'moderate' && label !== 'weak' && label !== 'none') label = 'none';

        var first = true;

        companyEl.textContent = data.company || '—';
        titleEl.textContent = data.title || '';

        var pct = fmtConfidence(data.match_confidence);
        confEl.textContent = pct + '%';
        confEl.title = pct + '% match';

        labelEl.className = 'badge ' + label;
        labelEl.innerHTML = '<span class="dot"></span>' + esc(label);
        locEl.textContent = data.location || '';

        var ev = Array.isArray(data.evidence) ? data.evidence : [];
        evidenceEl.innerHTML = '';
        ev.forEach(function(item, i){
          var li = document.createElement('li');
          li.className = 'row';
          li.textContent = String(item);
          li.style.setProperty('--i', i);
          evidenceEl.appendChild(li);
          first = false;
        });

        /* First reveal: fade + scale the card in. Later updates just refresh content. */
        if (!result.classList.contains('reveal')){
          result.classList.add('reveal');
        } else {
          /* Re-trigger the per-row stagger so updated evidence animates in again. */
          var rows = evidenceEl.querySelectorAll('.row');
          for (var k = 0; k < rows.length; k++){
            rows[k].style.animation = 'none';
            void rows[k].offsetWidth;
            rows[k].style.animation = '';
          }
        }
      }

      function attempt(){
        try{
          var data = JSON.parse(input.value);
          errEl.classList.remove('show');
          render(data);
        } catch (e){
          errEl.classList.add('show');
        }
      }

      btn.addEventListener('click', attempt);
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
          e.preventDefault();
          attempt();
        }
      });
    })();
  </script>
</body>
</html>
